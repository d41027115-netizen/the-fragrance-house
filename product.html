
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragrance Details | The Fragrance House</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">THE FRAGRANCE HOUSE</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#shop">Collection</a>
            <a href="index.html#contact">Contact</a>
        </nav>
        <a href="index.html#shop" class="back-to-shop">Back to Shop</a>
    </header>

    <main class="product-detail">
        <div class="product-detail-image">
            <img id="detail-image" src="" alt="Perfume bottle">
        </div>

        <div class="product-detail-info">
            <span id="detail-category"></span>
            <h1 id="detail-name">Fragrance Name</h1>

            <p id="detail-description"></p>

            <h3>Fragrance Profile</h3>
            <p id="detail-profile"></p>

            <h3>Perfect For</h3>
            <p id="detail-occasion"></p>

            <button id="detail-add-button">ADD TO BAG</button>

            <a href="index.html#shop">← Back to collection</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
